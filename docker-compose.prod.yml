services:
  sunnah-record:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunnah_record_app
    restart: always
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://shenron:abirmallik76922247@host.docker.internal:5432/main_db}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://sunnah.abirmallik.website}
